<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026-2027 겨울 골프 투어 투표 & 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-32">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5 text-xs text-emerald-200 font-semibold tracking-wide">
          <i class="fa-solid fa-golf-ball-tee"></i> 형진부부 & 은남 4인 투어
        </div>
        <h1 class="text-lg font-bold">겨울 골프 여행 후보 & 일정 투표</h1>
      </div>
      <span class="text-xs bg-emerald-700 border border-emerald-500/40 px-2.5 py-1 rounded-full text-emerald-100 font-semibold">
        2인 1실 × 2실 기준
      </span>
    </div>

    <!-- 탭 필터 -->
    <div class="max-w-xl mx-auto px-4 pt-1 pb-2 flex gap-2">
      <button onclick="setFilter('all')" id="btn-all" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-900 transition">전체 (6)</button>
      <button onclick="setFilter('japan')" id="btn-japan" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-900/60 text-emerald-100 transition">일본 규슈·우베 (3)</button>
      <button onclick="setFilter('korea')" id="btn-korea" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-900/60 text-emerald-100 transition">한국 남부·제주 (3)</button>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 숙소 원칙 및 가이드 -->
    <section class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs text-emerald-900 space-y-2">
      <div class="flex items-center justify-between font-bold text-sm text-emerald-950">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-bed text-emerald-700"></i> 투어 숙소 기본 원칙</span>
        <span class="text-[10px] bg-emerald-200/80 px-2 py-0.5 rounded-full text-emerald-900 font-bold">2인 1실 × 2개 방</span>
      </div>
      <p class="leading-relaxed text-emerald-800">
        두 부부의 프라이버시와 편안한 휴식을 위해 모든 플랜은 <strong>각 부부당 단독 1실(2인 1실 트윈/더블룸 2개)</strong> 기준으로 예산을 책정했습니다. 아래 각 후보를 살펴보고 마음에 드는 코스에 <strong>[원픽 선택(하트)]</strong>을 눌러주세요!
      </p>
    </section>

    <!-- 카드 리스트 컨테이너 -->
    <div id="card-container" class="space-y-4"></div>

    <!-- 동반자 의견 수렴 섹션 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
        <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 동반자 한 줄 의견 & 조율
      </h3>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="voter-name" placeholder="작성자 (예: 형진, 은남)" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
        <select id="voter-season" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 text-slate-700 font-medium">
          <option value="">희망 시기 선택</option>
          <option value="11월 말~12월 초">11월 말 ~ 12월 초</option>
          <option value="1월 중순~말">1월 중순 ~ 1월 말</option>
          <option value="2월 말~3월 초">2월 말 ~ 3월 초</option>
          <option value="언제든 상관없음">일정 상관없음</option>
        </select>
      </div>
      <textarea id="voter-comment" rows="2" placeholder="의견을 남겨주세요 (예: 가이세키 료칸 2인 1실 좋아요 / 평일 3박 4일 일정 찬성)" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-emerald-600"></textarea>
      <button onclick="saveFeedback()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl transition">
        내 의견 등록하기
      </button>

      <!-- 저장된 의견 리스트 -->
      <div id="feedback-list" class="pt-2 border-t border-slate-100 space-y-1.5"></div>
    </section>
  </main>

  <!-- 하단 고정 카카오톡 공유 플로팅 바 -->
  <div class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-3 shadow-lg">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      <div class="flex-1 truncate">
        <div class="text-[11px] text-slate-500 font-medium">나의 원픽 코스</div>
        <div id="picked-label" class="text-xs font-bold text-emerald-800 truncate">선택된 코스 없음 (하트 터치)</div>
      </div>
      <button onclick="copyForKakao()" class="bg-[#FEE500] hover:bg-[#FADA0A] text-[#191919] font-bold text-xs px-4 py-2.5 rounded-xl shadow-sm flex items-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-comment"></i> 단톡방에 의견 보내기
      </button>
    </div>
  </div>

  <!-- 세부 상세 모달 레이어 -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex flex-col justify-end">
    <div class="bg-white w-full max-w-xl mx-auto rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <span id="modal-tag" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800"></span>
          <h2 id="modal-title" class="text-base font-bold text-slate-900 mt-1"></h2>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 모달 탭 -->
      <div class="flex border-b border-slate-100 bg-slate-50 text-xs font-bold text-slate-600">
        <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="flex-1 py-2.5 border-b-2 border-emerald-600 text-emerald-700">🗓️ 일정표</button>
        <button onclick="switchTab('calc')" id="tab-btn-calc" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-500">💰 비용계산기</button>
        <button onclick="switchTab('info')" id="tab-btn-info" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-500">⛳ 코스·숙소</button>
      </div>

      <!-- 모달 본문 -->
      <div class="p-4 overflow-y-auto space-y-3 text-xs leading-relaxed" id="modal-body"></div>

      <!-- 모달 하단 픽 버튼 -->
      <div class="p-3 border-t border-slate-100 bg-white">
        <button id="modal-pick-btn" onclick="togglePickCurrent()" class="w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition">
          <i class="fa-regular fa-heart"></i> 이 코스를 내 픽으로 지정
        </button>
      </div>
    </div>
  </div>

  <script>
    const trips = [
      {
        id: "ube",
        category: "japan",
        badgeText: "일본 야마구치",
        title: "야마구치 우베 온천 & 54홀",
        duration: "3박 4일",
        bestDate: "2027년 1월 12일 ~ 1월 28일 (화~금)",
        temp: "8℃ ~ 13℃ (쾌적)",
        costPerPerson:
