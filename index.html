<html lang="ko">

  <title>2026-2027 겨울 골프 투어 투표 & 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-32">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5 text-xs text-emerald-200 font-semibold tracking-wide">
          <i class="fa-solid fa-golf-ball-tee"></i> 형진부부 & 은남 4인 투어
        </div>
        <h1 class="text-lg font-bold">겨울 골프 여행 후보 & 일정 투표</h1>
      </div>
      <span class="text-xs bg-emerald-700 border border-emerald-500/40 px-2.5 py-1 rounded-full text-emerald-100 font-semibold">
        2인 1실 × 2실 기준
      </span>
    </div>

    <!-- 탭 필터 -->
    <div class="max-w-xl mx-auto px-4 pt-1 pb-2 flex gap-2">
      <button onclick="setFilter('all')" id="btn-all" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-emerald-900 transition">전체 (6)</button>
      <button onclick="setFilter('japan')" id="btn-japan" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-900/60 text-emerald-100 transition">일본 규슈·우베 (3)</button>
      <button onclick="setFilter('korea')" id="btn-korea" class="filter-btn flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-900/60 text-emerald-100 transition">한국 남부·제주 (3)</button>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 숙소 원칙 및 가이드 -->
    <section class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs text-emerald-900 space-y-2">
      <div class="flex items-center justify-between font-bold text-sm text-emerald-950">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-bed text-emerald-700"></i> 투어 숙소 기본 원칙</span>
        <span class="text-[10px] bg-emerald-200/80 px-2 py-0.5 rounded-full text-emerald-900 font-bold">2인 1실 × 2개 방</span>
      </div>
      <p class="leading-relaxed text-emerald-800">
        두 부부의 프라이버시와 편안한 휴식을 위해 모든 플랜은 <strong>각 부부당 단독 1실(2인 1실 트윈/더블룸 2개)</strong> 기준으로 예산을 책정했습니다. 아래 각 후보를 살펴보고 마음에 드는 코스에 <strong>[원픽 선택(하트)]</strong>을 눌러주세요!
      </p>
    </section>

    <!-- 카드 리스트 컨테이너 -->
    <div id="card-container" class="space-y-4"></div>

    <!-- 동반자 의견 수렴 섹션 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
        <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 동반자 한 줄 의견 & 조율
      </h3>
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="voter-name" placeholder="작성자 (예: 형진, 은남)" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600">
        <select id="voter-season" class="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-600 text-slate-700 font-medium">
          <option value="">희망 시기 선택</option>
          <option value="11월 말~12월 초">11월 말 ~ 12월 초</option>
          <option value="1월 중순~말">1월 중순 ~ 1월 말</option>
          <option value="2월 말~3월 초">2월 말 ~ 3월 초</option>
          <option value="언제든 상관없음">일정 상관없음</option>
        </select>
      </div>
      <textarea id="voter-comment" rows="2" placeholder="의견을 남겨주세요 (예: 가이세키 료칸 2인 1실 좋아요 / 평일 3박 4일 일정 찬성)" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-emerald-600"></textarea>
      <button onclick="saveFeedback()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs py-2.5 rounded-xl transition">
        내 의견 등록하기
      </button>

      <!-- 저장된 의견 리스트 -->
      <div id="feedback-list" class="pt-2 border-t border-slate-100 space-y-1.5"></div>
    </section>
  </main>

  <!-- 하단 고정 카카오톡 공유 플로팅 바 -->
  <div class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-3 shadow-lg">

      </button>
    </div>
  </div>

  <!-- 세부 상세 모달 레이어 -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex flex-col justify-end">
    <div class="bg-white w-full max-w-xl mx-auto rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <span id="modal-tag" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800"></span>
          <h2 id="modal-title" class="text-base font-bold text-slate-900 mt-1"></h2>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 모달 탭 -->
      <div class="flex border-b border-slate-100 bg-slate-50 text-xs font-bold text-slate-600">
        <button onclick="switchTab('schedule')" id="tab-btn-schedule" class="flex-1 py-2.5 border-b-2 border-emerald-600 text-emerald-700">🗓️ 일정표</button>
        <button onclick="switchTab('calc')" id="tab-btn-calc" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-500">💰 비용계산기</button>

        costPerCouple: 1680000,
        luxuryPoint: "중문 5성급 파르나스/신라 호텔 2인 1실 2개, 흑돼지 프라이빗 룸",
        budgetPoint: "2월 말 설 연휴 직후 항공 특가 & 서귀포 해안 저지대 주중 비수기 그린피",
        desc: "겨울 한라산 눈 영향을 받지 않는 해안가 저지대 코스만 엄선하여 날씨 걱정 없이 쾌적하게 칩니다.",
        courses: ["롯데스카이힐 제주 (오션 코스)", "중문 골프클럽", "테디밸리 CC"],
        hotel: "파르나스 호텔 제주 (디럭스룸 2인 1실 2개)",
        itinerary: [
          { day: "1일차", desc: "제주 도착 → 렌터카 수령 → 중문CC 18홀 → 호텔 체크인 & 흑돼지 근고기 만찬" },
          { day: "2일차", desc: "롯데스카이힐CC 18홀 라운딩 → 서귀포 올레시장 투어 & 호텔 와인 타임" },
          { day: "3일차", desc: "테디밸리CC 18홀 라운딩 → 점심 후 공항 이동 및 귀경" }
        ],
        calcOptions: [
          { name: "전 일정 오션뷰 발코니 룸 업그레이드", cost: 80000, checked: true }
        ]
      }
    ];

    let currentFilter = 'all';
    let currentTripId = null;
    let currentTab = 'schedule';
    let pickedTripId = localStorage.getItem('golf_pick_id') || null;

    function renderCards() {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      const filtered = trips.filter(t => currentFilter === 'all' || t.category === currentFilter);

      filtered.forEach(t => {
        const isPicked = pickedTripId === t.id;
        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-4 shadow-sm border transition relative overflow-hidden ${isPicked ? 'border-emerald-600 ring-2 ring-emerald-500/20' : 'border-slate-200'}`;
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <div>
              <div class="flex items-center gap-1.5 mb-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  t.category === 'japan' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-blue-50 text-blue-700 border border-blue-200'
                }">
                  ${t.badgeText}
                </span>
                <span class="text-[10px] font-semibold text-slate-500">${t.duration}</span>
                <span class="text-[10px] text-slate-500 font-medium">🛏️ 2인1실×2실</span>
                ${isPicked ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-600 text-white">내 원픽 코스</span>' : ''}
              </div>
              <h2 class="text-base font-bold text-slate-900">${t.title}</h2>
            </div>
            <button onclick="togglePick('${t.id}')" class="text-xl p-1 transition ${isPicked ? 'text-rose-500' : 'text-slate-300 hover:text-rose-400'}">
              <i class="fa-${isPicked ? 'solid' : 'regular'} fa-heart"></i>
            </button>
          </div>

          <div class="bg-slate-50 rounded-xl p-2.5 text-xs text-slate-600 mb-3 space-y-1">
            <div class="flex items-center gap-1.5"><i class="fa-regular fa-calendar-check text-emerald-600"></i> <strong class="text-slate-800">추천 날짜:</strong> ${t.bestDate}</div>
            <div class="flex items-center gap-1.5"><i class="fa-solid fa-temperature-half text-amber-500"></i> <strong class="text-slate-800">기온:</strong> ${t.temp}</div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs mb-3">
            <div class="bg-amber-50/70 border border-amber-200/60 rounded-lg p-2">
              <span class="text-[10px] font-bold text-amber-900 flex items-center gap-1"><i class="fa-solid fa-crown text-[9px]"></i> 럭셔리 포인트</span>
              <p class="text-slate-700 text-[11px] line-clamp-2 mt-0.5">${t.luxuryPoint}</p>
            </div>
            <div class="bg-emerald-50/70 border border-emerald-200/60 rounded-lg p-2">
              <span class="text-[10px] font-bold text-emerald-900 flex items-center gap-1"><i class="fa-solid fa-tag text-[9px]"></i> 가성비 포인트</span>
              <p class="text-slate-700 text-[11px] line-clamp-2 mt-0.5">${t.budgetPoint}</p>
            </div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <div>
              <span class="text-[10px] text-slate-500">예상 경비 (1인 / 부부 2인당)</span>
              <div class="text-sm font-bold text-slate-900">
                약 ${t.costPerPerson.toLocaleString()}원 <span class="text-xs font-normal text-slate-500">(${t.costPerCouple.toLocaleString()}원)</span>
              </div>
            </div>
            <button onclick="openModal('${t.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1">
              상세보기 <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      updatePickUI();
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-emerald-900');
        btn.classList.add('bg-emerald-900/60', 'text-emerald-100');
      });
      document.getElementById(`btn-${type}`).classList.replace('bg-emerald-900/60', 'bg-white');
      document.getElementById(`btn-${type}`).classList.replace('text-emerald-100', 'text-emerald-900');
      renderCards();
    }

    function openModal(id) {
      currentTripId = id;
      const trip = trips.find(t => t.id === id);
      if(!trip) return;
      document.getElementById('modal-tag').textContent = `${trip.duration} · ${trip.badgeText} · 2인 1실 2개 기준`;
      document.getElementById('modal-title').textContent = trip.title;
      switchTab('schedule');
      document.getElementById('detail-modal').classList.remove('hidden');
      updateModalPickBtn();
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function switchTab(tab) {
      currentTab = tab;
      const trip = trips.find(t => t.id === currentTripId);
      const body = document.getElementById('modal-body');

      ['schedule', 'calc', 'info'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = (t === tab) 
          ? "flex-1 py-2.5 border-b-2 border-emerald-600 text-emerald-700 font-bold"
          : "flex-1 py-2.5 border-b-2 border-transparent text-slate-500 font-semibold";
      });

      if(tab === 'schedule') {
        body.innerHTML = `
          <div class="space-y-3">
            <div class="bg-emerald-50 text-emerald-900 p-2.5 rounded-xl text-xs font-semibold">
              📅 최적 추천 시기: ${trip.bestDate}
            </div>
            <div class="relative border-l-2 border-emerald-300 ml-2.5 space-y-4 py-1">
              ${trip.itinerary.map(item => `
                <div class="relative pl-4">
                  <div class="absolute -left-[7px] top-1 w-3 h-3 rounded-full bg-emerald-600 border-2 border-white"></div>
                  <strong class="text-slate-900 text-xs block mb-0.5">${item.day}</strong>
                  <p class="text-slate-600 text-[11px] leading-relaxed">${item.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if(tab === 'calc') {
        renderCalcTab(trip);
      } else if(tab === 'info') {
        body.innerHTML = `
          <div class="space-y-3">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
              <strong class="text-slate-900 block mb-1">⛳ 추천 골프장 코스</strong>
              <ul class="list-disc list-inside text-slate-600 space-y-1 text-[11px]">
                ${trip.courses.map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
              <strong class="text-slate-900 block mb-1">🏨 숙소 배정 (2인 1실 2실)</strong>
              <p class="text-slate-600 text-[11px]">${trip.hotel}</p>
            </div>
            <div class="bg-amber-50/70 p-3 rounded-xl border border-amber-200 text-amber-900">
              <strong class="block mb-0.5 text-xs">✨ 4인 투어 여행 팁</strong>
              <p class="text-[11px] leading-relaxed">${trip.desc}</p>
            </div>
          </div>
        `;
      }
    }

    function renderCalcTab(trip) {
      const body = document.getElementById('modal-body');
      let base = trip.costPerPerson;
      let extra = 0;
      trip.calcOptions.forEach(opt => { if(opt.checked) extra += opt.cost; });
      const totalPerson = base + extra;
      const totalCouple = totalPerson * 2;
      const totalTeam = totalPerson * 4;

      body.innerHTML = `
        <div class="space-y-3">
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
            <div class="flex justify-between text-slate-600 mb-1">
              <span>기본 예상 경비 (교통+그린피+2인1실 2개 숙박)</span>
              <span class="font-bold text-slate-800">${base.toLocaleString()}원</span>
            </div>
            <div class="flex justify-between text-slate-600">
              <span>선택 옵션 추가 금액</span>
              <span class="font-bold text-emerald-700">+${extra.toLocaleString()}원</span>
            </div>
          </div>

          <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-2">
            <span class="font-bold text-slate-800 block text-xs mb-1">선택 옵션 조절 (터치하여 견적 조정)</span>
            ${trip.calcOptions.map((opt, idx) => `
              <label class="flex items-center justify-between p-2 rounded-lg bg-slate-50 hover:bg-slate-100 cursor-pointer text-xs">
                <div class="flex items-center gap-2">
                  <input type="checkbox" onchange="toggleOption(${idx})" ${opt.checked ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-600">
                  <span class="text-slate-700">${opt.name}</span>
                </div>
                <span class="font-semibold text-slate-900">+${opt.cost.toLocaleString()}원</span>
              </label>
            `).join('')}
          </div>

          <div class="bg-emerald-800 text-white p-3 rounded-xl shadow-inner space-y-1 text-center">
            <div class="text-[11px] text-emerald-200">조정된 예상 예산</div>
            <div class="text-lg font-extrabold">1인당 약 ${totalPerson.toLocaleString()}원</div>
            <div class="text-xs text-emerald-100">부부 2인: ${totalCouple.toLocaleString()}원 / 4인 팀 총합: ${totalTeam.toLocaleString()}원</div>
          </div>
        </div>
      `;
    }

    function toggleOption(index) {
      const trip = trips.find(t => t.id === currentTripId);
      trip.calcOptions[index].checked = !trip.calcOptions[index].checked;
      renderCalcTab(trip);
    }

    function togglePick(id) {
      if(pickedTripId === id) {
        pickedTripId = null;
        localStorage.removeItem('golf_pick_id');
      } else {
        pickedTripId = id;
        localStorage.setItem('golf_pick_id', id);
      }
      renderCards();
      updateModalPickBtn();
    }

    function togglePickCurrent() {
      if(currentTripId) togglePick(currentTripId);
    }

    function updateModalPickBtn() {
      const btn = document.getElementById('modal-pick-btn');
      if(!btn || !currentTripId) return;
      if(pickedTripId === currentTripId) {
        btn.className = "w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 bg-rose-50 text-rose-600 border border-rose-200";
        btn.innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> 선택 취소하기`;
      } else {
        btn.className = "w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 bg-emerald-700 text-white";
        btn.innerHTML = `<i class="fa-regular fa-heart"></i> 이 코스를 내 픽으로 지정`;
      }
    }

    function updatePickUI() {
      const label = document.getElementById('picked-label');
      if(!pickedTripId) {
        label.textContent = "선택된 코스 없음 (하트 터치)";
        label.className = "text-xs font-normal text-slate-400 truncate";
      } else {
        const trip = trips.find(t => t.id === pickedTripId);
        label.textContent = `❤️ ${trip.title}`;
        label.className = "text-xs font-bold text-emerald-800 truncate";
      }
    }

    function saveFeedback() {
      const name = document.getElementById('voter-name').value.trim() || '익명';
      const season = document.getElementById('voter-season').value;
      const comment = document.getElementById('voter-comment').value.trim();
      const trip = trips.find(t => t.id === pickedTripId);
      const tripTitle = trip ? trip.title : '미선택';

      if(!comment && !season) {
        alert('희망 시기나 의견을 입력해 주세요.');
        return;
      }

      const item = { name, season, comment, tripTitle, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
      let list = JSON.parse(localStorage.getItem('golf_feedbacks') || '[]');
      list.unshift(item);
      localStorage.setItem('golf_feedbacks', JSON.stringify(list));

      document.getElementById('voter-comment').value = '';
      renderFeedbackList();
      alert('의견이 등록되었습니다! 아래 [단톡방에 의견 보내기]를 눌러 카톡으로도 공유해 보세요.');
    }

    function renderFeedbackList() {
      const container = document.getElementById('feedback-list');
      const list = JSON.parse(localStorage.getItem('golf_feedbacks') || '[]');
      if(list.length === 0) {
        container.innerHTML = `<p class="text-[11px] text-slate-400">등록된 동반자 의견이 없습니다.</p>`;
        return;
      }
      container.innerHTML = list.slice(0, 5).map(f => `
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-slate-800">${f.name} <span class="text-[10px] text-emerald-700 font-semibold">(${f.season || '시기미정'})</span></span>
            <span class="text-[10px] text-slate-400">${f.time}</span>
          </div>
          <div class="text-[11px] text-slate-600">${f.comment || '의견 없음'}</div>
          <div class="text-[10px] text-rose-500 font-semibold mt-1">픽: ${f.tripTitle}</div>
        </div>
      `).join('');
    }

    function copyForKakao() {
      const trip = trips.find(t => t.id === pickedTripId);
      const name = document.getElementById('voter-name').value.trim() || '우리 부부';
      const season = document.getElementById('voter-season').value || '협의 가능';
      const comment = document.getElementById('voter-comment').value.trim();

      let text = `[2026-2027 겨울 골프 투어 투표 의견]\n\n`;
      text += `👤 작성자: ${name}\n`;
      if(trip) {
        text += `⛳ 추천 원픽: ${trip.title} (${trip.duration})\n`;
        text += `📅 추천 날짜: ${trip.bestDate}\n`;
        text += `💰 예상 경비: 1인 약 ${trip.costPerPerson.toLocaleString()}원 (부부당 ${trip.costPerCouple.toLocaleString()}원)\n`;
        text += `🛏️ 숙소 배정: 2인 1실 × 2개 방\n`;
        text += `✨ 핵심 매력: ${trip.luxuryPoint}\n`;
      } else {
        text += `⛳ 추천 원픽: 아직 고르는 중\n`;
      }
      text += `🗓️ 희망 시기: ${season}\n`;
      if(comment) text += `💬 의견: "${comment}"\n`;
      text += `\n🔗 상세 일정 & 다른 후보 보기:\n${window.location.href}`;

      navigator.clipboard.writeText(text).then(() => {
        alert("카카오톡 단톡방에 붙여넣을 수 있는 요약문이 복사되었습니다!");
      }).catch(() => {
        prompt("아래 텍스트를 복사하여 카카오톡에 붙여넣으세요:", text);
      });
    }

    // 초기화
    renderCards();
    renderFeedbackList();
  </script>
</body>
</html>
